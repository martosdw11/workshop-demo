# CI — GitHub Actions (deploy ditangani Vercel Git Integration)
#
# Alur:
#   - Setiap push/PR  : lint + typecheck + unit test + integration test (Postgres 16 service)
#   - Deploy          : otomatis oleh Vercel Git Integration pada project
#                       `workshop-demo` (Preview untuk PR, Production untuk main).
#                       Tidak ada langkah deploy di sini — hindari deploy dobel.
#
# Env build/runtime production (DATABASE_URL, SESSION_SECRET, dst.) dikelola di
# Environment Variables project Vercel (team policy memaksa tipe Sensitive).

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: learning_study_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d learning_study_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Nilai dummy khusus CI — startup app memvalidasi env lewat Zod (src/server/env.ts)
    env:
      NODE_ENV: test
      APP_BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://app:app@localhost:5432/learning_study_ai
      SESSION_SECRET: ci-only-session-secret-not-for-production-0001
      STORAGE_DRIVER: local
      LOCAL_STORAGE_DIR: ./storage/uploads
      MEDIA_PUBLIC_HOST: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Integration tests
        run: npm run test:integration
